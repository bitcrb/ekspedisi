<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengarahkan...</title>
    <script>
        // URL Web App Google Script
        const baseUrl = "https://script.google.com/macros/s/AKfycbyxzhV3ERW5870_MnZ0jkW6x4E4Cn2-e4cSsDBRmzjrHv5h1nibSoL2X-jTBFrunR-PCg/exec";
        
        // Menambahkan parameter prompt=select_account untuk memutus cookie sesi lama
        const redirectUrl = baseUrl + "?prompt=select_account";

        // Mengalihkan halaman
        window.location.replace(redirectUrl);
    </script>
</head>
<body>
    <div style="text-align: center; margin-top: 20%; font-family: sans-serif;">
        <p>Mengarahkan Anda ke aplikasi...</p>
        <p>Jika tidak teralihkan otomatis, <a id="manualLink" href="#">klik di sini</a>.</p>
    </div>
    <script>
        document.getElementById("manualLink").href = redirectUrl;
    </script>
</body>
</html>
